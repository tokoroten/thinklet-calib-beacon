<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>THINKLET 較正ビーコン</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:#111;font-family:system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;padding:10px}
  #qrimg{width:88vmin;height:88vmin;background:#fff;cursor:pointer}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
  button{font-size:20px;padding:13px 20px;border-radius:12px;border:2px solid #111;background:#111;color:#fff}
  button.off{background:#fff;color:#111}
  label,select{font-size:15px}
  small{color:#666;text-align:center;max-width:92vw}
  /* 全画面QR */
  body.fs{padding:0;gap:0}
  body.fs .controls,body.fs small{display:none}
  body.fs #qrimg{width:100vmin;height:100vmin}
</style>
</head>
<body>
  <img id="qrimg" src="aruco.png" alt="marker" title="タップで全画面/戻る"/>
  <div class="controls">
    <button id="toggle" class="off">▶ 音を鳴らす</button>
    <label>音:
      <select id="mode">
        <option value="noise">連続ノイズ(スイープ向き)</option>
        <option value="click">クリック(静止1ショット)</option>
        <option value="chirp">チャープ</option>
      </select>
    </label>
    <label>BPM <input id="bpm" type="range" min="40" max="600" value="120"/> <b id="bpmv">120</b></label>
  </div>
  <small>マーカーをタップで全画面。画面の明るさは<b>中くらい</b>に（明るすぎ＝白飛びで検出不可）。スイープは「連続ノイズ」で。</small>
<script>
let ctx=null, timer=null, wl=null, on=false, noiseSrc=null, pinkBuf=null;
const bpm=document.getElementById('bpm'), bpmv=document.getElementById('bpmv');
const toggle=document.getElementById('toggle'), mode=document.getElementById('mode'), qrimg=document.getElementById('qrimg');
bpm.oninput=()=>{ bpmv.textContent=bpm.value; if(on && mode.value!=='noise') restart(); };
mode.onchange=()=>{ if(on){ stop(); start(); } };
qrimg.onclick=()=> document.body.classList.toggle('fs');

function pinkBuffer(seconds){
  const n=Math.floor(ctx.sampleRate*seconds), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<n;i++){ const w=Math.random()*2-1;
    b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520;
    b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926; }
  return b;
}
function clickBuffer(){
  const dur=0.004, n=Math.max(1,Math.floor(ctx.sampleRate*dur)), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++){ const env=1-i/n; d[i]=(Math.random()*2-1)*env*env; } return b;
}
function chirpBuffer(){
  const dur=0.012, n=Math.floor(ctx.sampleRate*dur), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
  const f0=1200,f1=6500,k=(f1-f0)/dur;
  for(let i=0;i<n;i++){ const t=i/ctx.sampleRate, ph=2*Math.PI*(f0*t+0.5*k*t*t), env=Math.sin(Math.PI*i/n); d[i]=Math.sin(ph)*env; } return b;
}
function tick(){
  const src=ctx.createBufferSource(); src.buffer = mode.value==='chirp'? chirpBuffer():clickBuffer();
  const g=ctx.createGain(); g.gain.value=0.95; src.connect(g).connect(ctx.destination); src.start();
}
function restart(){ clearInterval(timer); timer=setInterval(tick, 60000/parseInt(bpm.value)); }
async function start(){
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); await ctx.resume();
  if(mode.value==='noise'){
    pinkBuf=pinkBuf||pinkBuffer(3);
    noiseSrc=ctx.createBufferSource(); noiseSrc.buffer=pinkBuf; noiseSrc.loop=true;
    const g=ctx.createGain(); g.gain.value=0.8; noiseSrc.connect(g).connect(ctx.destination); noiseSrc.start();
  } else { tick(); restart(); }
  on=true; toggle.textContent='■ 停止'; toggle.classList.remove('off');
  try{ wl=await navigator.wakeLock.request('screen'); }catch(e){}
}
function stop(){
  clearInterval(timer);
  if(noiseSrc){ try{noiseSrc.stop();}catch(e){} noiseSrc=null; }
  on=false; toggle.textContent='▶ 音を鳴らす'; toggle.classList.add('off');
  if(wl){ try{wl.release();}catch(e){} wl=null; }
}
toggle.onclick=()=> on ? stop() : start();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&on&&navigator.wakeLock){
  navigator.wakeLock.request('screen').then(w=>wl=w).catch(()=>{}); }});
</script>
</body>
</html>
